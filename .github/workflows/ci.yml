name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { go-version-file: go.mod, cache-dependency-path: go.sum }
      - run: test -z "$(gofmt -l ./cmd ./internal ./engine ./bind)" || { gofmt -l ./cmd ./internal ./engine ./bind; exit 1; }
      - run: sh -n scripts/*.sh
      - run: go vet ./...
      - run: make bind-check   # bind/ still binds with gomobile (no NDK/Xcode needed)
      - run: go test ./... -count=1 -p 1
      - run: make build && REPEAT=1 ./scripts/selftest.sh
      - name: installer smoke test
        run: |
          dir="$(mktemp -d)"
          CPPROBE_INSTALL_DIR="$dir" sh scripts/install.sh
          "$dir/cpprobe" version
      - run: docker build -t censorpulse-probe:ci .
