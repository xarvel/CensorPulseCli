name: release

# Tag `vX.Y.Z` → static binaries for the usual platforms, a SHA256SUMS file
# and a GitHub release. scripts/install.sh prefers these assets when a
# release exists, and falls back to building from source.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache-dependency-path: go.sum }
      - run: go vet ./... && go test ./... -count=1 -p 1
      - name: cross-compile
        run: |
          VERSION="${GITHUB_REF_NAME}" make cross
          cd dist && sha256sum cpprobe-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/cpprobe-*
            dist/SHA256SUMS
          generate_release_notes: true
