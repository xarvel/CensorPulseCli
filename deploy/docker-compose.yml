# CensorPulse probe server.
#
#   docker compose up -d --build
#   docker compose logs probe | grep -E "SPKI|WireGuard"     # pin + WG key for clients
#
# Edit probe.yaml next to this file to change ports or limits.
#
# network_mode: host is required: a bridge network's userland proxy/NAT changes
# timing and breaks the "one socket, many protocols" demultiplexing on UDP.
services:
  probe:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${CPPROBE_VERSION:-dev}
    image: censorpulse-probe:${CPPROBE_VERSION:-dev}
    container_name: cpprobe
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ./probe.yaml:/etc/cpprobe/probe.yaml:ro
      - probe-data:/var/lib/cpprobe/data
    environment:
      - QUIC_GO_DISABLE_RECEIVE_BUFFER_WARNING=true
    ulimits:
      nofile: 65536
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8443/v1/params"]  # port must follow control_port in probe.yaml
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  probe-data:
